metadata:
  name: plan-audit
  namespace: xronos-spec
  annotations:
    xronos.run-order: "8"
    xronos.run-after: "spec-plan"
    xronos.produces: "/results/plan_audit.json"
    xronos.consumes: "/results/spec_plan.json,/results/verifier_baseline_plan.json"
spec:
  suspend: true
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        xronos-role: gpu-verifier
      containers:
        - name: plan-audit
          image: xronos:gpu
          imagePullPolicy: IfNotPresent
          env:
            - name: EXPERIMENT_RUNS
              value: "5"
            - name: PROMPT_COUNT
              value: "4"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          command: ["/bin/bash", "-lc"]
          args:
            - |
              python -m xronos.infer.plan_audit \
                --plan /results/spec_plan.json /results/verifier_baseline_plan.json \
                --min-runs "$EXPERIMENT_RUNS" \
                --min-prompts "$PROMPT_COUNT" \
                --min-gammas 5 \
                --summary-energy-key mean_drafter_active_energy_mj_per_token \
                --paired-energy-key system_active_energy_mj_per_generated_token \
                --require-two-device-boundary \
                --out /results/plan_audit.json
          volumeMounts:
            - name: results
              mountPath: /results
      volumes:
        - name: results
          persistentVolumeClaim:
            claimName: spec-results
---
