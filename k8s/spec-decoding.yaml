apiVersion: batch/v1
kind: Job
metadata:
  name: artifact-audit
  namespace: xronos-spec
  annotations:
    xronos.run-order: "12"
    xronos.run-after: "spec-report"
    xronos.produces: "/results/artifact_audit.json"
    xronos.consumes: "/results/report_gamma_freq"
spec:
  suspend: true
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        xronos-role: gpu-verifier
      containers:
        - name: audit
          image: xronos:gpu
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-lc"]
          args:
            - |
              python -m xronos.infer.artifact_audit \
                --results-dir /results \
                --report-dir /results/report_gamma_freq \
                --require-report-ok \
                --out /results/artifact_audit.json
          volumeMounts:
            - name: results
              mountPath: /results
      volumes:
        - name: results
          persistentVolumeClaim:
            claimName: spec-results
---
apiVersion: batch/v1
kind: Job
metadata:
  name: spec-report
  namespace: xronos-spec
  annotations:
    xronos.run-order: "11"
    xronos.run-after: "spec-driver"
    xronos.produces: "/results/report_gamma_freq"
    xronos.consumes: "/results/spec_plan.json,/results/verifier_baseline_plan.json,/results/spec_gamma_sweep.csv,/results/verifier_baseline.csv,/results/drafter_doctor.json,/results/verifier_doctor.json,/results/driver_doctor.json,/results/plan_audit.json,/results/network_probe.json,/results/k8s_manifest_audit.json,/results/k8s_runbook.json,/results/k8s_runbook.md,/results/spec_trace.jsonl,/results/verifier_baseline_trace.jsonl"
spec:
  suspend: true
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        xronos-role: gpu-verifier
      containers:
        - name: report
          image: xronos:gpu
          imagePullPolicy: IfNotPresent
          env:
            - name: EXPERIMENT_RUNS
              value: "5"
            - name: PROMPT_COUNT
              value: "4"
            - name: MAX_RUNTIME_TEMP_C
              value: "85"
            - name: MAX_ENERGY_CV
              value: "0.50"
            - name: MAX_LATENCY_CV
              value: "0.50"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          command: ["/bin/bash", "-lc"]
          args:
            - |
              python -m xronos.infer.experiment_report \
                --plan /results/spec_plan.json /results/verifier_baseline_plan.json \
                --input /results/spec_gamma_sweep.csv /results/verifier_baseline.csv \
                --doctor-json /results/drafter_doctor.json /results/verifier_doctor.json /results/driver_doctor.json \
                --plan-audit-json /results/plan_audit.json \
                --network-json /results/network_probe.json \
                --k8s-manifest-audit-json /results/k8s_manifest_audit.json \
                --k8s-runbook-json /results/k8s_runbook.json \
                --k8s-runbook-markdown /results/k8s_runbook.md \
                --trace-jsonl /results/spec_trace.jsonl /results/verifier_baseline_trace.jsonl \
                --require-doctor \
                --require-driver-doctor \
                --require-plan-audit \
                --require-k8s-manifest-audit \
                --require-network-probe \
                --require-trace \
                --require-interaction-analysis \
                --require-claim-readiness \
                --require-two-device-boundary \
                --summary-energy-key mean_drafter_active_energy_mj_per_token \
                --paired-energy-key system_active_energy_mj_per_generated_token \
                --min-runs "$EXPERIMENT_RUNS" \
                --min-prompts "$PROMPT_COUNT" \
                --min-gammas 5 \
                --min-power-samples 3 \
                --paired-bootstrap-samples 1000 \
                --max-runtime-temp-c "$MAX_RUNTIME_TEMP_C" \
                --max-energy-cv "$MAX_ENERGY_CV" \
                --max-latency-cv "$MAX_LATENCY_CV" \
                --fail-on-throttle \
                --out-dir /results/report_gamma_freq
          volumeMounts:
            - name: results
              mountPath: /results
      volumes:
        - name: results
          persistentVolumeClaim:
            claimName: spec-results
