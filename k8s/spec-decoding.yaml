            - name: IDLE_BASELINE_S
              value: "5"
            - name: SWEEP_SEED
              value: "42"
            - name: EXPERIMENT_RUNS
              value: "5"
            - name: MAX_START_TEMP_C
              value: "85"
            - name: THERMAL_WAIT_TIMEOUT_S
              value: "300"
            - name: STARTUP_TIMEOUT_S
              value: "900"
            - name: HEALTH_CHECK_INTERVAL_S
              value: "5"
            - name: HF_HOME
              value: /models/huggingface
            - name: TRANSFORMERS_CACHE
              value: /models/huggingface/transformers
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
                  optional: true
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          command: ["/bin/bash", "-lc"]
          args:
            - |
              python -m xronos.infer.verifier_baseline_driver \
                --drafter-addr spec-drafter:50061 \
                --verifier-addr spec-verifier:50062 \
                --tokenizer "$TOKENIZER" \
                --prompts-jsonl /config/prompts.jsonl \
                --drafter-freqs-hz 408000000,612000000,828000000 \
                --verifier-clocks-mhz 810,1050,1410 \
                --max-new-tokens 64 \
                --stop-token-ids "" \
                --idle-baseline-s "$IDLE_BASELINE_S" \
                --idle-baseline-policy run \
                --shuffle-conditions --seed "$SWEEP_SEED" \
                --shuffle-runs \
                --sample-runtime-metadata \
                --startup-timeout-s "$STARTUP_TIMEOUT_S" \
                --health-check-interval-s "$HEALTH_CHECK_INTERVAL_S" \
                --max-start-temp-c "$MAX_START_TEMP_C" \
                --thermal-wait-timeout-s "$THERMAL_WAIT_TIMEOUT_S" \
                --warmup-runs 1 \
                --runs "$EXPERIMENT_RUNS" \
                --out /results/verifier_baseline.csv \
                --resume \
                --plan-out /results/verifier_baseline_plan.json \
                --trace-out /results/verifier_baseline_trace.jsonl
          volumeMounts:
            - name: results
              mountPath: /results
            - name: model-cache
              mountPath: /models
            - name: prompts
              mountPath: /config
      volumes:
        - name: results
          persistentVolumeClaim:
            claimName: spec-results
        - name: model-cache
          persistentVolumeClaim:
            claimName: hf-cache
        - name: prompts
          configMap:
            name: spec-prompts
