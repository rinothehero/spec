apiVersion: v1
kind: Namespace
metadata:
  name: xronos-spec
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: spec-results
  namespace: xronos-spec
spec:
  storageClassName: ""
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  selector:
    matchExpressions:
      - key: type
        operator: In
        values:
          - nfs
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hf-cache
  namespace: xronos-spec
spec:
  storageClassName: ""
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 50Gi
  selector:
    matchExpressions:
      - key: type
        operator: In
        values:
          - nfs
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spec-prompts
  namespace: xronos-spec
data:
  prompts.jsonl: |
    {"id": "mobile_ai", "prompt": "The future of mobile AI is"}
    {"id": "edge_inference", "prompt": "Efficient edge inference requires"}
    {"id": "wireless_systems", "prompt": "In a wireless edge system, the main bottleneck is"}
    {"id": "distributed_llm", "prompt": "Distributed LLM inference can reduce latency by"}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: drafter-doctor
  namespace: xronos-spec
  annotations:
    xronos.run-order: "1"
    xronos.run-after: ""
    xronos.produces: "/results/drafter_doctor.json"
    xronos.consumes: ""
spec:
  suspend: true
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        xronos-role: jetson-drafter
      containers:
        - name: doctor
          image: xronos:jetson
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          env:
            - name: DRAFTER_MODEL
              value: meta-llama/Llama-3.2-1B
            - name: DRAFTER_GPU_FREQ_HZ
              value: "612000000"
            - name: DRAFTER_GPU_DEVFREQ_ROOT
              value: ""
            - name: HF_HOME
              value: /models/huggingface
            - name: TRANSFORMERS_CACHE
              value: /models/huggingface/transformers
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
                  optional: true
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          command: ["/bin/bash", "-lc"]
          args:
            - |
              python -m xronos.infer.experiment_doctor \
                --role drafter \
                --model "$DRAFTER_MODEL" \
                --device cuda:0 \
                --jetson-gpu-freq-hz "$DRAFTER_GPU_FREQ_HZ" \
                --jetson-gpu-devfreq-root "$DRAFTER_GPU_DEVFREQ_ROOT" \
                --require-hf-token \
                --require-power \
                --require-frequency-control \
                --json-out /results/drafter_doctor.json
          resources:
            limits:
              nvidia.com/gpu: 1
          volumeMounts:
            - name: results
              mountPath: /results
            - name: model-cache
              mountPath: /models
            - name: sysfs
              mountPath: /sys
            - name: dev
              mountPath: /dev
      volumes:
        - name: results
          persistentVolumeClaim:
            claimName: spec-results
        - name: model-cache
          persistentVolumeClaim:
            claimName: hf-cache
        - name: sysfs
          hostPath:
            path: /sys
        - name: dev
          hostPath:
            path: /dev
---
apiVersion: batch/v1
kind: Job
metadata:
  name: driver-doctor
  namespace: xronos-spec
  annotations:
    xronos.run-order: "3"
    xronos.run-after: "verifier-doctor"
    xronos.produces: "/results/driver_doctor.json"
    xronos.consumes: ""
spec:
  suspend: true
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        xronos-role: gpu-verifier
      containers:
        - name: doctor
          image: xronos:gpu
          imagePullPolicy: IfNotPresent
          env:
            - name: TOKENIZER
              value: meta-llama/Llama-3.2-1B
            - name: PROMPT_COUNT
              value: "4"
            - name: HF_HOME
              value: /models/huggingface
            - name: TRANSFORMERS_CACHE
              value: /models/huggingface/transformers
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
                  optional: true
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          command: ["/bin/bash", "-lc"]
          args:
            - |
              python -m xronos.infer.experiment_doctor \
                --role driver \
                --tokenizer "$TOKENIZER" \
                --prompts-jsonl /config/prompts.jsonl \
                --min-prompts "$PROMPT_COUNT" \
                --k8s-manifest k8s/spec-decoding.yaml \
                --require-k8s-manifest \
                --require-hf-token \
                --json-out /results/driver_doctor.json
          volumeMounts:
            - name: results
              mountPath: /results
            - name: model-cache
              mountPath: /models
            - name: prompts
              mountPath: /config
      volumes:
        - name: results
          persistentVolumeClaim:
            claimName: spec-results
        - name: model-cache
          persistentVolumeClaim:
            claimName: hf-cache
        - name: prompts
          configMap:
            name: spec-prompts
---
apiVersion: batch/v1
kind: Job
metadata:
  name: verifier-doctor
  namespace: xronos-spec
  annotations:
    xronos.run-order: "2"
    xronos.run-after: "drafter-doctor"
    xronos.produces: "/results/verifier_doctor.json"
    xronos.consumes: ""
spec:
  suspend: true
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        xronos-role: gpu-verifier
      containers:
        - name: doctor
          image: xronos:gpu
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          env:
            - name: VERIFIER_MODEL
              value: meta-llama/Llama-3.2-3B
            - name: VERIFIER_GPU_CLOCK_MHZ
              value: "1410"
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility
            - name: HF_HOME
              value: /models/huggingface
            - name: TRANSFORMERS_CACHE
              value: /models/huggingface/transformers
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
                  optional: true
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          command: ["/bin/bash", "-lc"]
          args:
            - |
              python -m xronos.infer.experiment_doctor \
                --role verifier \
                --model "$VERIFIER_MODEL" \
                --device cuda:0 \
                --gpu-index 0 \
                --gpu-clock-mhz "$VERIFIER_GPU_CLOCK_MHZ" \
                --require-hf-token \
                --require-power \
                --require-frequency-control \
                --json-out /results/verifier_doctor.json
          resources:
            limits:
              nvidia.com/gpu: 1
          volumeMounts:
            - name: results
              mountPath: /results
            - name: model-cache
              mountPath: /models
      volumes:
        - name: results
          persistentVolumeClaim:
            claimName: spec-results
        - name: model-cache
          persistentVolumeClaim:
            claimName: hf-cache
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spec-drafter
  namespace: xronos-spec
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spec-drafter
  template:
    metadata:
      labels:
        app: spec-drafter
    spec:
      nodeSelector:
        xronos-role: jetson-drafter
      containers:
        - name: drafter
          image: xronos:jetson
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          env:
            - name: DRAFTER_MODEL
              value: meta-llama/Llama-3.2-1B
            - name: DRAFTER_GPU_FREQ_HZ
              value: "612000000"
            - name: DRAFTER_GPU_DEVFREQ_ROOT
              value: ""
            - name: HF_HOME
              value: /models/huggingface
            - name: TRANSFORMERS_CACHE
              value: /models/huggingface/transformers
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
                  optional: true
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          command: ["/bin/bash", "-lc"]
          args:
            - |
              python -m xronos.infer.drafter_server \
                --model "$DRAFTER_MODEL" \
                --host "[::]" --port 50061 \
                --device cuda:0 --dtype float16 \
                --power-interval 0.01 \
                --jetson-gpu-freq-hz "$DRAFTER_GPU_FREQ_HZ" \
                --jetson-gpu-devfreq-root "$DRAFTER_GPU_DEVFREQ_ROOT"
          ports:
            - containerPort: 50061
          resources:
            limits:
              nvidia.com/gpu: 1
          startupProbe:
            tcpSocket:
              port: 50061
            periodSeconds: 10
            failureThreshold: 120
          readinessProbe:
            tcpSocket:
              port: 50061
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 50061
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: model-cache
              mountPath: /models
            - name: sysfs
              mountPath: /sys
            - name: dev
              mountPath: /dev
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: hf-cache
        - name: sysfs
          hostPath:
            path: /sys
        - name: dev
          hostPath:
            path: /dev
---
apiVersion: v1
kind: Service
metadata:
  name: spec-drafter
  namespace: xronos-spec
spec:
  selector:
    app: spec-drafter
  ports:
    - name: grpc
      port: 50061
      targetPort: 50061
---
