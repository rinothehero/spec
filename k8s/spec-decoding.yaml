---
apiVersion: batch/v1
kind: Job
metadata:
  name: k8s-manifest-audit
  namespace: xronos-spec
  annotations:
    xronos.run-order: "4"
    xronos.run-after: "driver-doctor"
    xronos.produces: "/results/k8s_manifest_audit.json,/results/k8s_runbook.json,/results/k8s_runbook.md"
    xronos.consumes: ""
spec:
  suspend: true
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        xronos-role: gpu-verifier
      containers:
        - name: audit
          image: xronos:gpu
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              python -m xronos.infer.k8s_manifest_audit \
                --manifest k8s/spec-decoding.yaml \
                --out /results/k8s_manifest_audit.json
              python -m xronos.infer.k8s_runbook \
                --manifest k8s/spec-decoding.yaml \
                --out /results/k8s_runbook.json \
                --markdown-out /results/k8s_runbook.md
          volumeMounts:
            - name: results
              mountPath: /results
      volumes:
        - name: results
          persistentVolumeClaim:
            claimName: spec-results
---
apiVersion: batch/v1
kind: Job
metadata:
  name: network-probe
  namespace: xronos-spec
  annotations:
    xronos.run-order: "5"
    xronos.run-after: "k8s-manifest-audit"
    xronos.produces: "/results/network_probe.json"
    xronos.consumes: ""
spec:
  suspend: true
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        xronos-role: gpu-verifier
      containers:
        - name: network-probe
          image: xronos:gpu
          imagePullPolicy: IfNotPresent
          env:
            - name: STARTUP_TIMEOUT_S
              value: "900"
            - name: HEALTH_CHECK_INTERVAL_S
              value: "5"
            - name: NETWORK_PROBE_SAMPLES
              value: "20"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          command: ["/bin/bash", "-lc"]
          args:
            - |
              python -m xronos.infer.network_probe \
                --drafter-addr spec-drafter:50061 \
                --verifier-addr spec-verifier:50062 \
                --samples "$NETWORK_PROBE_SAMPLES" \
                --warmup-samples 3 \
                --startup-timeout-s "$STARTUP_TIMEOUT_S" \
                --health-check-interval-s "$HEALTH_CHECK_INTERVAL_S" \
                --out /results/network_probe.json
          volumeMounts:
            - name: results
              mountPath: /results
      volumes:
        - name: results
          persistentVolumeClaim:
            claimName: spec-results
---
apiVersion: batch/v1
kind: Job
metadata:
  name: verifier-baseline-plan
  namespace: xronos-spec
  annotations:
    xronos.run-order: "6"
    xronos.run-after: "network-probe"
    xronos.produces: "/results/verifier_baseline_plan.json"
    xronos.consumes: ""
spec:
  suspend: true
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        xronos-role: gpu-verifier
      containers:
        - name: plan
          image: xronos:gpu
          imagePullPolicy: IfNotPresent
          env:
            - name: TOKENIZER
              value: meta-llama/Llama-3.2-1B
            - name: IDLE_BASELINE_S
              value: "5"
            - name: SWEEP_SEED
              value: "42"
            - name: EXPERIMENT_RUNS
              value: "5"
            - name: MAX_START_TEMP_C
              value: "85"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          command: ["/bin/bash", "-lc"]
          args:
            - |
              python -m xronos.infer.verifier_baseline_driver \
                --dry-run \
                --drafter-addr spec-drafter:50061 \
                --verifier-addr spec-verifier:50062 \
                --tokenizer "$TOKENIZER" \
                --prompts-jsonl /config/prompts.jsonl \
                --drafter-freqs-hz 408000000,612000000,828000000 \
                --verifier-clocks-mhz 810,1050,1410 \
                --max-new-tokens 64 \
                --stop-token-ids "" \
                --idle-baseline-s "$IDLE_BASELINE_S" \
                --idle-baseline-policy run \
                --shuffle-conditions --seed "$SWEEP_SEED" \
                --shuffle-runs \
                --sample-runtime-metadata \
                --max-start-temp-c "$MAX_START_TEMP_C" \
                --warmup-runs 1 \
                --runs "$EXPERIMENT_RUNS" \
                --out /results/verifier_baseline.csv \
                --plan-out /results/verifier_baseline_plan.json \
                --trace-out /results/verifier_baseline_trace.jsonl
          volumeMounts:
            - name: results
              mountPath: /results
            - name: prompts
              mountPath: /config
      volumes:
        - name: results
          persistentVolumeClaim:
            claimName: spec-results
        - name: prompts
          configMap:
            name: spec-prompts
---
